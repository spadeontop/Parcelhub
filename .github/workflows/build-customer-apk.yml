name: Build Customer Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/customer-fcm-integration
      - dev
      - main
    paths:
      - 'apps/customer-mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/build-customer-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/customer-mobile/package-lock.json'

      - name: 3. Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Customer Mobile Dependencies
        run: npm --prefix apps/customer-mobile ci

      - name: 6. Prebuild Native Android Project
        working-directory: apps/customer-mobile
        env:
          EXPO_PUBLIC_API_URL: https://parcelhub-spade.vercel.app
        run: npx expo prebuild --platform android --clean

      - name: 7. Build Standalone Release APK via Gradle
        working-directory: apps/customer-mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://parcelhub-spade.vercel.app
        run: ./gradlew assembleRelease --no-daemon

      - name: 8. Rename APK for Clarity
        run: |
          mkdir -p build-output
          cp apps/customer-mobile/android/app/build/outputs/apk/release/*.apk build-output/parcelhub-customer.apk

      - name: 9. Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parcelhub-customer-apk
          path: build-output/parcelhub-customer.apk
          retention-days: 14

      - name: 10. Publish Direct APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feat/customer-fcm-integration' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: apk-latest
          name: ParcelHub Customer Mobile Standalone APK
          body: |
            ### ParcelHub Customer Mobile Standalone Release
            - **Backend Endpoint**: https://parcelhub-spade.vercel.app
            - **FCM Push Notifications**: Configured (com.spadeontop.parcelhub)
            - **Build**: Standalone Native Android APK
            
            👉 **Direct Download**: Tap `parcelhub-customer.apk` below on your Android device to install.
          files: build-output/parcelhub-customer.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
